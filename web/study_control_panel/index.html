<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Kinova Gen3 Lite Study Control Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 20px;
    background: #fff;
    color: #111;
  }
  h1 { font-size: 1.1rem; font-weight: 600; }
  .card {
    width: 100%;
    max-width: 360px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  label { font-size: 13px; color: #333; }
  input[type="text"], select {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    color: #111;
  }
  .radio-row { display: flex; gap: 16px; font-size: 14px; }
  button {
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f5f5f5;
    color: #111;
    font-size: 14px;
    padding: 10px 14px;
    transition: background 0.08s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover:not(:disabled) { background: #e8e8e8; }
  button:disabled { color: #aaa; cursor: not-allowed; opacity: 0.6; }
  button.stop { border-color: #c33; color: #c33; }
  button.stop:hover:not(:disabled) { background: #fdeaea; }
  .status-line { font-size: 13px; color: #555; }
  .status-line .value { font-weight: 600; }
  .status-running { color: #b8860b; }
  .status-done { color: #2a7; }
  .status-failed { color: #c33; }
  #error-box {
    font-size: 13px;
    color: #c33;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<h1>Kinova Gen3 Lite &mdash; Study Control Panel</h1>

<div class="card">
  <div>
    <button id="home-btn" onclick="startHome()">Home Robot</button>
    <div class="status-line">Homing: <span id="homing-status" class="value">idle</span></div>
  </div>
</div>

<div class="card">
  <label for="user-id">Participant ID (numeric)</label>
  <input type="text" id="user-id" inputmode="numeric" placeholder="e.g. 042" oninput="refreshButtons()"/>

  <label>Environment</label>
  <div class="radio-row">
    <label><input type="radio" name="env" value="env_a" checked onchange="refreshButtons()"/> Env A</label>
    <label><input type="radio" name="env" value="env_b" onchange="refreshButtons()"/> Env B</label>
  </div>

  <label for="audio-device-select">Audio device</label>
  <select id="audio-device-select"><option value="default">default</option></select>

  <label for="video-device-select">Camera</label>
  <select id="video-device-select"><option value="">auto-detect</option></select>

  <button id="start-btn" onclick="startStudy()">Start Study</button>
  <button id="stop-btn" class="stop" onclick="stopStudy()" disabled>Stop Study</button>
  <div class="status-line">Study: <span id="study-status" class="value">idle</span></div>
  <div class="status-line">Audio: <span id="audio-status" class="value">idle</span></div>
  <div class="status-line">Video: <span id="video-status" class="value">idle</span></div>
</div>

<div id="error-box"></div>

<script>
let latestStatus = {
  homing: 'idle', study: 'idle', has_homed: false,
  audio_recording: false, audio_start_error: null, default_audio_device: 'default',
  video_recording: false, video_start_error: null, default_video_device: '',
};
let audioDevicesLoaded = false;
let videoDevicesLoaded = false;

async function loadAudioDevices() {
  try {
    const resp = await fetch('/audio_devices');
    const data = await resp.json();
    const select = document.getElementById('audio-device-select');
    select.innerHTML = '';
    for (const dev of data.devices) {
      const opt = document.createElement('option');
      opt.value = dev.id;
      opt.textContent = dev.label;
      select.appendChild(opt);
    }
    select.value = latestStatus.default_audio_device;
    audioDevicesLoaded = true;
  } catch (e) {
    // pw-record may not be installed / no cards present -- the 'default'
    // option already in the page's static HTML still works as a fallback
  }
}

async function loadVideoDevices() {
  try {
    const resp = await fetch('/video_devices');
    const data = await resp.json();
    const select = document.getElementById('video-device-select');
    select.innerHTML = '<option value="">auto-detect</option>';
    for (const dev of data.devices) {
      const opt = document.createElement('option');
      opt.value = dev.id;
      opt.textContent = dev.label;
      select.appendChild(opt);
    }
    if (latestStatus.default_video_device) {
      select.value = latestStatus.default_video_device;
    }
    videoDevicesLoaded = true;
  } catch (e) {
    // no camera / udevadm unavailable -- 'auto-detect' stays the fallback,
    // and the server itself skips video recording if none is ever found
  }
}

function selectedEnv() {
  return document.querySelector('input[name="env"]:checked').value;
}

function showError(msg) {
  document.getElementById('error-box').textContent = msg || '';
}

function setStatusText(elId, value) {
  const el = document.getElementById(elId);
  el.textContent = value;
  el.className = 'value' + (value === 'running' ? ' status-running'
    : value === 'done' ? ' status-done'
    : value === 'failed' ? ' status-failed' : '');
}

function refreshButtons() {
  const userId = document.getElementById('user-id').value.trim();
  const userIdValid = /^[0-9]+$/.test(userId);
  const studyRunning = latestStatus.study === 'running';
  const homingRunning = latestStatus.homing === 'running';

  document.getElementById('home-btn').disabled = studyRunning || homingRunning;
  document.getElementById('start-btn').disabled =
    studyRunning || homingRunning || !latestStatus.has_homed || !userIdValid;
  document.getElementById('stop-btn').disabled = !studyRunning;
}

async function pollStatus() {
  try {
    const resp = await fetch('/status');
    latestStatus = await resp.json();
    setStatusText('homing-status', latestStatus.homing);
    setStatusText('study-status', latestStatus.study);
    setStatusText('audio-status', latestStatus.audio_recording ? 'running' : 'idle');
    if (latestStatus.audio_start_error) {
      showError('audio recording failed to start: ' + latestStatus.audio_start_error);
    }
    setStatusText('video-status', latestStatus.video_recording ? 'running' : 'idle');
    if (latestStatus.video_start_error) {
      showError('video recording failed to start: ' + latestStatus.video_start_error);
    }
    if (!audioDevicesLoaded) { loadAudioDevices(); }
    if (!videoDevicesLoaded) { loadVideoDevices(); }
    refreshButtons();
  } catch (e) {
    // transient network hiccup while polling -- ignore, next poll will retry
  }
}

async function startHome() {
  showError('');
  const resp = await fetch('/home', { method: 'POST' });
  const data = await resp.json();
  if (!resp.ok) { showError(data.error || 'failed to start homing'); }
  pollStatus();
}

async function startStudy() {
  showError('');
  const userId = document.getElementById('user-id').value.trim();
  const audioDevice = document.getElementById('audio-device-select').value;
  const videoDevice = document.getElementById('video-device-select').value;
  const resp = await fetch('/start_study', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      user_id: userId, env_id: selectedEnv(),
      audio_device: audioDevice, video_device: videoDevice,
    }),
  });
  const data = await resp.json();
  if (!resp.ok) { showError(data.error || 'failed to start study'); }
  pollStatus();
}

async function stopStudy() {
  showError('');
  const resp = await fetch('/stop_study', { method: 'POST' });
  if (!resp.ok) {
    const data = await resp.json();
    showError(data.error || 'failed to stop study');
  }
  pollStatus();
}

pollStatus();
setInterval(pollStatus, 1000);
</script>

</body>
</html>
