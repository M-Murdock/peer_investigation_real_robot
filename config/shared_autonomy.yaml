# Defaults for shared_autonomy_node. Same conservative safety-clamp
# defaults as safety_limits.yaml (see that file's comments) — the clamp is
# unchanged by shared autonomy, it just receives a blended pre-clamp
# action instead of one policy's raw action.
shared_autonomy_node:
  ros__parameters:
    # Evidence is cosine similarity (range [-1, 1]) between the human's
    # jog direction and each goal's policy direction, so temperature
    # controls how many consistent cycles it takes to build confidence,
    # not the magnitude of a single-step comparison.
    temperature: 3.0
    # jog_mode=cartesian (default): sticks move the end effector in X/Y/Z
    # via the Jacobian (jog_scale_m_s). jog_mode=joint: sticks map straight
    # to joints 1-4 (jog_scale_rad_s). Only the active mode's scale is used.
    jog_mode: cartesian
    jog_scale_rad_s: 0.3
    jog_scale_m_s: 0.15
    # Each goal's raw suggested delta is normalized to a unit direction
    # scaled to this magnitude before belief-weighting and summing with
    # the human's jog input — otherwise a goal delta whose raw magnitude
    # happens to be much larger than the human's deliberately small jog
    # (e.g. a potential field far from its target) dominates the blend
    # regardless of belief, swamping the human's steering entirely once
    # the final safety clamp saturates. Kept equal to safety.max_step_rad
    # so pure-autonomy motion (stick centered) already sits at the
    # safety-clamped rate, not throttled further by a smaller value here.
    #
    # 0.01 rad/cycle (~0.1 rad/s effective) was Milestone 1's deliberately
    # extremely-conservative first-live-test value. Raised to 0.03 rad —
    # at control_rate_hz=10 this now matches max_velocity_rad_s*dt exactly
    # (~0.3 rad/s effective), still comfortably under the hardware's own
    # 0.5 rad/s soft cap (ros2_kortex's joint_limits.yaml) — after several
    # confirmed-safe live runs at the smaller value, per the runbook's
    # "progressively relax, still under the hardware cap" staged-rollout
    # rule. Steps this small could also look stuttery on real hardware
    # (near-stationary start-stop motion each cycle) — a moderate increase
    # addresses both speed and smoothness together.
    assist_step_rad: 0.03
    safety.max_step_rad: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03]
    safety.max_velocity_rad_s: [0.3, 0.3, 0.3, 0.3, 0.3, 0.3]
    safety.joint_lower_rad: [-2.68, -2.61, -2.61, -2.60, -2.53, -2.60]
    safety.joint_upper_rad: [2.68, 2.61, 2.61, 2.60, 2.53, 2.60]
